# robocon-lean — one workspace, three environments.
#
#   demo   ROS 2 Humble + MuJoCo 3.11 + CPU libtorch: builds and runs the
#          rl_sar-derived runtime (sim_node + rl_sim) against MuJoCo.
#   eval   CPU-only judge/evaluation stack (MuJoCo 3.11 + CPU torch), no ROS.
#   train  GPU training / export stack (mjlab + rsl_rl + CUDA torch).
#
# MuJoCo stays pinned to 3.11.0 in every environment: the official blackW MJCF
# declares timestep 0.002 s and is the shared physics reference for training,
# judging and demo runs. The workspace keeps a single committed pixi.lock
# (resolved once for linux-64) — no per-environment locks and no --frozen. Select
# an environment explicitly (`pixi install -e demo|eval|train`).

[workspace]
authors = ["What410802 <what410802@126.com>"]
channels = ["robostack-humble", "conda-forge"]
name = "robocon-lean"
platforms = ["linux-64"]
version = "0.1.0"

[activation.env]
MUJOCO_GL = "egl"
ROS_LOCALHOST_ONLY = "1"

# ---------------------------------------------------------------------------
# train — validated training/export set
# ---------------------------------------------------------------------------
[feature.train.dependencies]
python = "3.12.*"

[feature.train.pypi-dependencies]
# Keep the validated set together: the CUDA wheel comes from PyPI and
# mujoco-warp/mjlab/rsl_rl versions all change numerics or checkpoint formats.
#
# torch is the SAME VERSION as the CPU wheel pinned for demo/eval below.  The
# depth-conditioned plum policy is contact-chaotic and already flipped its judge
# verdict between a 2.12 and a 2.14 kernel (2026-11-07: the same exported file
# failed in the eval env and passed in the train env), so one version across the
# three environments is what makes a judged trace reproducible.
torch = "==2.14.1"
mujoco = "==3.11.0"
mujoco-warp = "==3.11.0"
mjlab = "==1.6.0"
rsl-rl-lib = "==5.4.2"
warp-lang = "==1.17.0"
tensorboard = ">=2.21.0,<3"
alldog-mjlab = { path = "train", editable = true }
robocon-eval = { path = "eval", editable = true }

# ---------------------------------------------------------------------------
# demo — ROS 2 runtime + MuJoCo
# ---------------------------------------------------------------------------
[feature.demo.dependencies]
python = "3.12.*"
ros-humble-ros-base = "*"
colcon-common-extensions = "*"
cmake = "*"
ninja = "*"
cxx-compiler = "*"
mujoco = "3.11.*"
tbb-devel = "*"
yaml-cpp = "*"
numpy = "*"
pyyaml = "*"
evdev = "*"

[feature.demo.pypi-dependencies]
robocon-eval = { path = "eval", editable = true }
# CPU libtorch from the PyTorch wheel: the same 2.14.1 build as eval uses, and
# the same version as the train env.  (conda libtorch 2.14.1 cannot coexist with
# mujoco 3.11: they need incompatible libabseil/protobuf generations.)  rl_sar
# finds this wheel's CMake config, so C++ inference and the Python judge share
# one numeric stack.
torch = { url = "https://download.pytorch.org/whl/cpu/torch-2.14.1%2Bcpu-cp312-cp312-manylinux_2_28_x86_64.whl" }

# ---------------------------------------------------------------------------
# eval — CPU judge
# ---------------------------------------------------------------------------
[feature.eval.dependencies]
python = "3.12.*"
numpy = "*"
pyyaml = "*"
mujoco = "3.11.*"
pytest = ">=9.0"
pillow = "*"

[feature.eval.pypi-dependencies]
robocon-eval = { path = "eval", editable = true }
# Same CPU torch build as the demo runtime (see the demo section).
torch = { url = "https://download.pytorch.org/whl/cpu/torch-2.14.1%2Bcpu-cp312-cp312-manylinux_2_28_x86_64.whl" }

# ---------------------------------------------------------------------------
# environments & tasks
# ---------------------------------------------------------------------------
[environments]
train = ["train"]
demo = ["demo"]
eval = ["eval"]

[tasks]
# Always select an environment explicitly, e.g.:
#   pixi run -e eval  eval-pytest
#   pixi run -e demo  demo-build
eval-pytest = "python -m pytest eval/tests -q"
demo-build = "bash tools/build.sh"
demo-tests = "bash tools/demo_tests.sh"
env-check = "python tools/check_env.py"
