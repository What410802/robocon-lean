seed: 43
num_steps_per_env: 96
max_iterations: 50
obs_groups:
  actor: !!python/tuple
  - actor
  critic: !!python/tuple
  - critic
save_interval: 25
experiment_name: blackw_velocity_him
run_name: row2_adaptive_s43
logger: tensorboard
wandb_project: mjlab
wandb_tags: !!python/tuple []
resume: true
load_run: .*row1_adaptive_s43$
load_checkpoint: model_348.pt
clip_actions: 100.0
upload_model: true
class_name: OnPolicyRunner
actor:
  hidden_dims: !!python/tuple
  - 512
  - 256
  - 128
  activation: elu
  obs_normalization: false
  cnn_cfg: null
  distribution_cfg:
    class_name: GaussianDistribution
    init_std: 0.1
    std_type: scalar
    learn_std: true
  rnn_type: null
  rnn_hidden_dim: 256
  rnn_num_layers: 1
  class_name: alldog_mjlab.algorithms.him.policy:HIMPolicy
  encoder_hidden_dims: !!python/tuple
  - 128
  - 64
  target_encoder_hidden_dims: !!python/tuple
  - 128
  - 64
  num_prototypes: 32
  temperature: 3.0
  estimator_learning_rate: 0.001
  estimator_max_grad_norm: 10.0
  estimator_optimizer: adam
critic:
  hidden_dims: !!python/tuple
  - 512
  - 256
  - 128
  activation: elu
  obs_normalization: true
  cnn_cfg: null
  distribution_cfg: null
  rnn_type: null
  rnn_hidden_dim: 256
  rnn_num_layers: 1
  class_name: MLPModel
algorithm:
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.001
  schedule: fixed
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.0
  desired_kl: 0.01
  max_grad_norm: 1.0
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  optimizer: adam
  share_cnn_encoders: false
  class_name: alldog_mjlab.algorithms.him.ppo:HIMPPO
him:
  history_group: actor
  velocity_group: estimator_velocity
  command_dim: 3
  latent_dim: 16
  terminal_ids_key: him_terminal_env_ids
  terminal_frame_key: him_terminal_actor_frame
  terminal_velocity_key: him_terminal_estimator_velocity
warm_start: false
warm_start_supported: false
command_curriculum_restore: range
